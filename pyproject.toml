[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foxess-local"
version = "0.1.0"
description = "Fully-local, evidence-first SDK for FoxESS Smart WiLAN devices (no FoxCloud)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "foxess-local contributors" }]
keywords = ["foxess", "sunspec", "modbus", "solar", "inverter", "local"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
mqtt = ["paho-mqtt>=2.0"]
prometheus = ["prometheus-client>=0.20"]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5", "fastapi>=0.110", "prometheus-client>=0.20"]

[project.scripts]
fox = "foxess.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/foxess"]

[tool.hatch.build.targets.wheel.force-include]
"src/foxess/data/fox_model_defs.json" = "foxess/data/fox_model_defs.json"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/foxess"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["paho.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
